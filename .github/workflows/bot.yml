name: Telegram bot

on:
  schedule:
    # каждые 10 минут: ответы на сообщения; с 18:00 МСК — ещё и рассылка на завтра
    # (один раз в день, повтор защищён полем last_daily в state.json)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        type: choice
        options: [run, poll, send_daily]
        default: run

permissions:
  contents: write

# запуски идут строго по очереди, иначе они перезапишут state.json друг друга
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MODE: ${{ inputs.mode || 'run' }}
          BOT_TIMEZONE: Europe/Moscow
          DAILY_HOUR: "18"
        run: python bot.py "$MODE"

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json subscribers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update bot state"
          git pull --rebase
          git push
