name: Bot daily

on:
  schedule:
    - cron: "0 18 * * *"    # 18:00 UTC = 21:00 МСК
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить сейчас, даже до 21:00 МСК и повторно"
        type: boolean
        default: false

permissions:
  contents: write

# общая группа для poll и daily: запуски идут по очереди и не перезаписывают
# state.json/subscribers.json друг друга. Идущий запуск не прерывается; в очереди
# GitHub держит только один ожидающий — поэтому poll подстраховывает рассылку.
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send tomorrow's rehearsals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TIMEZONE: Europe/Moscow
          # смена таблицы/вкладки без правки кода: Settings → Secrets and variables →
          # Actions → Variables (пусто — значения по умолчанию из schedule_parser.py)
          SCHEDULE_SPREADSHEET_ID: ${{ vars.SCHEDULE_SPREADSHEET_ID }}
          SCHEDULE_SHEET_NAME: ${{ vars.SCHEDULE_SHEET_NAME }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        # бот сам проверяет время: без --force шлёт только с 21:00 МСК и раз в сутки
        run: python bot.py send_daily $FORCE

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json subscribers.json
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "Update bot state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
