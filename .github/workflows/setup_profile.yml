name: Bot setup profile

# Имя, короткое описание, описание и меню команд бота в Telegram.
# Фото профиля Bot API не ставит — это вручную через @BotFather (/setuserpic).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Установить (выключено — только показать, что будет установлено)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Setup profile
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: python bot.py setup_profile $APPLY
