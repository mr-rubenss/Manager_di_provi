name: Bot poll

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может задерживать запуск)
  workflow_dispatch:

permissions:
  contents: write

# общая группа для poll и daily: запуски идут по очереди и не перезаписывают
# state.json/subscribers.json друг друга. Идущий запуск не прерывается; в очереди
# GitHub держит только один ожидающий — поэтому poll подстраховывает рассылку.
concurrency:
  group: telegram-bot-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # run = обработка сообщений + проверка изменений в таблице (уведомления,
      # schedule_snapshot.json) + запасная рассылка: если daily.yml после
      # 21:00 МСК не отработал (GitHub отменяет ожидающий запуск, когда в ту же
      # группу concurrency встаёт новый), рассылку сделает poll. Повтора не будет:
      # дата последней рассылки хранится в state.json.
      - name: Process messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TIMEZONE: Europe/Moscow
          # смена таблицы/вкладки без правки кода: Settings → Secrets and variables →
          # Actions → Variables (пусто — значения по умолчанию из schedule_parser.py)
          SCHEDULE_SPREADSHEET_ID: ${{ vars.SCHEDULE_SPREADSHEET_ID }}
          SCHEDULE_SHEET_NAME: ${{ vars.SCHEDULE_SHEET_NAME }}
        run: python bot.py run

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json subscribers.json schedule_snapshot.json
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "Update bot state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
